[project]
name = "military-attendance-check"
version = "0.1.0"
description = "Student attendance monitoring system with YOLO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.241",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "numpy==1.26.4",
    "insightface>=0.7.3",
    # 1.24 trở lên bỏ wheel cho cp310, mà .python-version đang ghim 3.10
    "onnxruntime>=1.17.0,<1.24",
]

[project.optional-dependencies]
# Máy có GPU NVIDIA: InsightFace chạy CUDA thay vì CPU (xem app/hw.py). Cùng tên
# import "onnxruntime" với bản CPU nên KHÔNG cài chung một venv — Dockerfile bản
# GPU gỡ bản CPU rồi cài bản này (xem Dockerfile, biến TORCH_VARIANT=cu128).
gpu = ["onnxruntime-gpu>=1.20,<1.24"]
# Máy chỉ có CPU: xuất YOLO sang OpenVINO rồi nạp bằng Ultralytics nhanh hơn .pt
# hẳn (xem app/detector.py, AI_BACKEND=openvino).
openvino = ["openvino>=2025.0"]
